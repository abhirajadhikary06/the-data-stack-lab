services:

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692" 
    environment:
      RABBITMQ_DEFAULT_USER: username
      RABBITMQ_DEFAULT_PASS: password
    command: >
      sh -c "rabbitmq-server & 
             sleep 10 && 
             rabbitmq-plugins enable rabbitmq_prometheus &&
             wait"
    networks:
      - celery-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - celery-network

  worker:
    build: .
    container_name: celery_worker
    command: celery -A celery_app worker --loglevel=info -E
    volumes:
      - .:/celery
    depends_on:
      - rabbitmq
      - redis
    networks:
      - celery-network
      - telecom-network

  beat:
    build: .
    container_name: celery_beat
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - .:/celery
    depends_on:
      - rabbitmq
      - redis
    networks:
      - celery-network

  flower:
    build: .
    container_name: flower
    command: >
      celery -A celery_app flower
      --port=5555
      --broker-api=http://username:password@rabbitmq:15672/api/
    ports:
      - "5555:5555"
    volumes:
      - .:/celery
    depends_on:
      - rabbitmq
      - redis
    networks:
      - celery-network

  # Prometheus - time-series database
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - rabbitmq
      - redis
    networks:
      - celery-network

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis_exporter
    ports:
      - "9121:9121"
    command:
      - "--redis.addr=redis://redis:6379"
    depends_on:
      - redis
    networks:
      - celery-network

  # Celery Prometheus Exporter
  celery-exporter:
    build: .
    container_name: celery_exporter
    command: celery-prometheus-exporter --broker=amqp://username:password@rabbitmq:5672// --transport-options='{"visibility_timeout":3600}'
    ports:
      - "8888:8888"
    depends_on:
      - rabbitmq
      - worker
    networks:
      - celery-network

  # Grafana - visualization dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: 'grafana-piechart-panel'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - celery-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  celery-network:
    driver: bridge
    name: celery-network
  telecom-network:
    external: true
    name: telecom-network
