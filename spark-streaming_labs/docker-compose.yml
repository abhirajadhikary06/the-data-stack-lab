services:
  # ---------------------------------------------------------------------
  # Kafka (KRaft mode, no Zookeeper needed)
  # ---------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"        # external client access (from your host machine)
      - "9093:9093"        # controller port (KRaft)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - streaming-net

  # ---------------------------------------------------------------------
  # Kafka UI - browse topics/messages at http://localhost:8080
  # ---------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - streaming-net

  # ---------------------------------------------------------------------
  # Spark cluster
  # NOTE: Spark's internal UI listens on 8080 by default, which collides
  # with kafka-ui above. We keep the container-internal port at 8080 but
  # map it to a different port on your host machine (9090).
  # ---------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    command: >
      bash -c "
      /opt/spark/sbin/start-master.sh &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.master*.out
      "
    ports:
      - "9090:8080"   # Spark Master UI  -> http://localhost:9090
      - "7077:7077"   # Spark Master port (used by workers / spark-submit)
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/spark-data
    networks:
      - streaming-net

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 2g &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker*.out"
    ports:
      - "8081:8081"   # Worker UI -> http://localhost:8081
    depends_on:
      - spark-master
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/spark-data
    networks:
      - streaming-net

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 2g &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker*.out"
    ports:
      - "8082:8081"   # Worker UI -> http://localhost:8082 (internal port is still 8081)
    depends_on:
      - spark-master
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/spark-data
    networks:
      - streaming-net

  # ---------------------------------------------------------------------
  # Weather producer - fetches weatherapi.com data and pushes to Kafka
  # ---------------------------------------------------------------------
  weather-producer:
    image: python:3.11-slim
    container_name: weather-producer
    working_dir: /app
    volumes:
      - ./apps:/app
    environment:
      WEATHERAPI_KEY: "${WEATHERAPI_KEY}"          # set this in a .env file (see README)
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_TOPIC: "weather-data"
      CITIES: "London,New York,Tokyo,Kolkata,Sydney"
      FETCH_INTERVAL_SECONDS: "10"
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt && python producer.py"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - streaming-net

networks:
  streaming-net:
    driver: bridge

volumes:
  kafka_data: