services:
  app:
    image: myapp:latest
    build:
      context: ./app
    ports:
      - "3000:3000"
    environment:
      APP_ENV: production
    volumes:
      - app_data:/usr/src/app
    networks:
      - app_network
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: always

networks:
  app_network:
    driver: bridge

volumes:
  app_data:
  db_data: