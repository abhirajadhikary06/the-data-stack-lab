version: 2

models:
  - name: stg_orders
    description: "Staging table for orders data."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Identifier for the customer who placed the order."
        tests:
          - not_null
      - name: order_status
        description: "Status of the order (e.g., completed, pending)."
        tests:
          - not_null
      - name: order_created_at
        description: "Timestamp when the order was placed."
        tests:
          - not_null

  - name: stg_customers
    description: "Staging table for customers data."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Name of the customer."
        tests:
          - not_null
      - name: email
        description: "Email address of the customer."
        tests:
          - not_null
          - unique
      - name: created_at
        description: "Timestamp when the customer was created."
        tests:
          - not_null
      