version: 2

models:
  - name: stg_orders
    description: "Staging table for orders data."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Identifier for the customer who placed the order."
        tests:
          - not_null
      - name: order_status
        description: "Status of the order (e.g., completed, pending)."
        tests:
          - not_null
          - accepted_values:
              values: ['completed', 'pending', 'cancelled']
      - name: order_created_at
        description: "Timestamp when the order was placed."
        tests:
          - not_null

  - name: stg_customers
    description: "Staging table for customers data."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Name of the customer."
        tests:
          - not_null
      - name: email
        description: "Email address of the customer."
        tests:
          - not_null
          - unique
      - name: created_at
        description: "Timestamp when the customer was created."
        tests:
          - not_null
    
  - name: stg_emp_workspace_country
    description: "Staging table for employee workspace country data."
    columns:
      - name: workspace_country
        description: "Country of the workspace."
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: 
                  - Argentina
                  - Australia
                  - Brazil
                  - Canada
                  - China
                  - Germany
                  - Ghana
                  - India
                  - Italy
                  - Japan
                  - Mexico
                  - Nigeria
                  - Portugal
                  - Singapore
                  - Spain
                  - United Kingdom
                  - United States
